# nginx configuration for AppFlowy-Cloud with hosted Supabase as the auth server.
#
# Fork-local file (upstream nginx/nginx.conf is left untouched). Mounted over
# /etc/nginx/nginx.conf by docker-compose.override.yml.
#
# The bundled gotrue container is not deployed; every /gotrue/ request is
# proxied to the Supabase project's Auth server (Supabase Auth is GoTrue).
# Supabase's gateway requires an `apikey` header on /auth/v1/* — nginx injects
# the project's anon key here so unmodified AppFlowy clients keep working.
#
# Before deploying, set the two values below for your Supabase project:
#   - $supabase_host      (project ref + .supabase.co)
#   - $supabase_anon_key  (Dashboard -> Settings -> API -> anon/publishable key;
#                          public by design, safe to commit)

events {
    worker_connections 1024;
}

http {
    # docker dns resolver (also resolves external names via the host DNS)
    resolver 127.0.0.11 valid=10s;
    #error_log /var/log/nginx/error.log debug;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

     map $http_origin $cors_origin {
         default $http_origin;
      }

    server {
        listen 8080;

        # https://github.com/nginxinc/nginx-prometheus-exporter
        location = /stub_status {
            stub_status;
        }
    }

    # Internal-only listener for the Rust server's own GoTrue calls
    # (user_info during /api/user/verify provisioning, admin user ops, startup
    # health check). Reached as http://nginx:81/gotrue from inside the compose
    # network; the port is never published. Same apikey injection as the public
    # block, but /gotrue/admin/ stays reachable here.
    server {
        listen 81;

        set $supabase_host "ffvwjxcfmtgwogilzupd.supabase.co";
        set $supabase_anon_key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmdndqeGNmbXRnd29naWx6dXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTc3ODIsImV4cCI6MjA5ODk5Mzc4Mn0.955a1ipYmCg9RIBXMxodjMAizDBa7BVVP_Tb5vSv0O8";

        location /gotrue/ {
            rewrite ^/gotrue(/.*)$ /auth/v1$1 break;
            proxy_pass https://$supabase_host;

            proxy_set_header Host $supabase_host;
            proxy_set_header apikey $supabase_anon_key;
            # Authorization passes through untouched: user Bearer tokens for
            # /user and /logout, the self-minted service-role token for /admin.

            proxy_ssl_server_name on;
            proxy_ssl_name $supabase_host;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        }
    }

    server {
        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private_key.key;

        listen 80;
        listen 443 ssl;
        client_max_body_size 10M;

        underscores_in_headers on;
        set $appflowy_cloud_backend "http://appflowy_cloud:8000";
        set $appflowy_web_backend "http://appflowy_web:80";
        set $minio_backend "http://minio:9001";
        set $minio_api_backend "http://minio:9000";
        # Host name for minio, used internally within docker compose
        set $minio_internal_host "minio:9000";

        set $supabase_host "ffvwjxcfmtgwogilzupd.supabase.co";
        set $supabase_anon_key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmdndqeGNmbXRnd29naWx6dXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTc3ODIsImV4cCI6MjA5ODk5Mzc4Mn0.955a1ipYmCg9RIBXMxodjMAizDBa7BVVP_Tb5vSv0O8";

        # GoTrue -> Supabase Auth
        location /gotrue/ {
            rewrite ^/gotrue(/.*)$ /auth/v1$1 break;
            proxy_pass https://$supabase_host;

            proxy_set_header Host $supabase_host;
            proxy_set_header apikey $supabase_anon_key;

            proxy_ssl_server_name on;
            proxy_ssl_name $supabase_host;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        }

        # GoTrue admin API is server-side only (internal listener on :81).
        # Supabase already rejects calls without a service-role token; this
        # keeps the surface off the public host entirely.
        location /gotrue/admin/ {
            return 403;
        }

        # AppFlowy's account self-deletion calls the GoTrue admin delete API.
        # With shared Supabase auth that would hard-delete the user's entire
        # afrinexus account, so deletion stays owned by afrinexus's erasure
        # flow. DELETE is the only route at the bare /api/user path.
        location = /api/user {
            return 403;
        }

        # WebSocket
        location /ws {
            # Existing proxy configuration
            proxy_pass $appflowy_cloud_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        location /api {
            proxy_pass $appflowy_cloud_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;

            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
                proxy_pass $appflowy_cloud_backend;
                proxy_request_buffering off;
                client_max_body_size 256M;
            }

            # AppFlowy-Cloud
            location /api/chat {
                proxy_pass $appflowy_cloud_backend;

                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding on;
                proxy_buffering off;
                proxy_cache off;

                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
            }

            location /api/import {
                proxy_pass $appflowy_cloud_backend;

                # Set headers
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Host $http_host;

                # Timeouts
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;

                # Disable buffering for large file uploads
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_cache off;
                client_max_body_size 2G;
            }
        }

        # Minio Web UI
        # Derive from: https://min.io/docs/minio/linux/integrations/setup-nginx-proxy-with-minio.html
        # Optional Module, comment this section if you did not deploy minio in docker-compose.yml
        # This endpoint is meant to be used for the MinIO Web UI, accessible via the admin portal
        location /minio/ {
            proxy_pass $minio_backend;

            rewrite ^/minio/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            ## This is necessary to pass the correct IP to be hashed
            real_ip_header X-Real-IP;

            proxy_connect_timeout 300s;

            ## To support websockets in MinIO versions released after January 2023
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Some environments may encounter CORS errors (Kubernetes + Nginx Ingress)
            # Uncomment the following line to set the Origin request to an empty string
            # proxy_set_header Origin '';

            chunked_transfer_encoding off;
        }

        # Optional Module, comment this section if you did not deploy minio in docker-compose.yml
        # This is used for presigned url, which is needs to be exposed to the AppFlowy client application.
        location /minio-api/ {
            proxy_pass $minio_api_backend;

            # Set the host to internal host because the presigned url was signed against the internal host
            proxy_set_header Host $minio_internal_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            rewrite ^/minio-api/(.*) /$1 break;

            proxy_connect_timeout 300s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            client_max_body_size 0;
        }

        # AI
        location /ai/ {
            proxy_pass $appflowy_cloud_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AppFlowy Web
        location / {
            proxy_pass $appflowy_web_backend;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Host $host;
        }
    }

}
