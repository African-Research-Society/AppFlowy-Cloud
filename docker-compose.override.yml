# ARS Better Auth deployment override. Preserve all existing AppFlowy data volumes.

services:
  gotrue:
    profiles: ["disabled"]

  admin_frontend:
    profiles: ["disabled"]

  appflowy_cloud:
    # Build the ARS fork so its membership gate is included in production.
    build:
      context: .
      dockerfile: Dockerfile
    image: ars/appflowy_cloud:local
    # This fork serves its internal health endpoint at /health.
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
    environment:
      - ARS_MEMBERSHIP_API_URL=${ARS_INTERNAL_API_URL:?Required}/workspace-access
      - ARS_INTERNAL_API_KEY=${ARS_INTERNAL_API_KEY:?Required}
      - ARS_AUTH_ISSUER=${ARS_AUTH_ISSUER:?Required}
      - APPFLOWY_GOTRUE_BASE_URL=${ARS_AUTH_API_URL:?Required}
      - APPFLOWY_GOTRUE_JWT_SECRET=${APPFLOWY_BRIDGE_SECRET:?Required}
      - ARS_WORKSPACE_OPERATOR_UUID=${ARS_WORKSPACE_OPERATOR_UUID:-}
    depends_on: !override
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  appflowy_web:
    environment:
      - ARS_AUTH_ORIGIN=${ARS_AUTH_ORIGIN:?Required}
    build:
      args:
        # Pin the embedding patch so Docker's cache cannot reuse an older main.
        REVISION: ${APPFLOWY_WEB_REVISION:?Pin the reviewed ARS OAuth web commit}

  ai:
    environment:
      - APPFLOWY_GOTRUE_JWT_SECRET=${APPFLOWY_BRIDGE_SECRET:?Required}

  appflowy_search:
    environment:
      - APPFLOWY_GOTRUE_JWT_SECRET=${APPFLOWY_BRIDGE_SECRET:?Required}

  minio:
    # Docker Hub no longer serves this image. Pin the official multi-arch image.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    # Upstream's 30s interval means nothing depended on this healthcheck
    # before; now that startup blocks on it, check often enough that a deploy
    # is not held up for half a minute.
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 12

  # Both config files travel in images rather than bind mounts: Coolify turns
  # relative bind mounts into managed paths it creates itself, as empty
  # directories, which either fails the container outright (nginx) or silently
  # skips the file (postgres initdb). See the Dockerfiles for the details.
  nginx:
    build:
      context: .
      dockerfile: docker/ars-nginx/Dockerfile
    image: ars/appflowy-nginx:local
    volumes: !override
      # Dropping the base nginx.conf mount; keeping the ssl ones, which are
      # long-established Coolify file storages with real content behind them.
      - ./nginx/ssl/certificate.crt:/etc/nginx/ssl/certificate.crt
      - ./nginx/ssl/private_key.key:/etc/nginx/ssl/private_key.key

  postgres:
    build:
      context: .
      dockerfile: docker/postgres-auth-shim/Dockerfile
    image: ars/appflowy-postgres:local
    volumes: !override
      # Keep the existing production database volume exactly as named.
      - postgres_auth_shim_data:/var/lib/postgresql/data

volumes:
  postgres_auth_shim_data:
