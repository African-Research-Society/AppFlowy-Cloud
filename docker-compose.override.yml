# Supabase-as-auth deployment override.
#
# Fork-local file; docker compose merges it with docker-compose.yml
# automatically (requires compose v2.24.4+ for the !override tag). See
# doc/SUPABASE_AUTH.md for the full setup, including required env vars.
#
# Auth is delegated to the hosted Supabase project (see
# nginx/nginx.supabase.conf), so the bundled gotrue container — and the
# admin_frontend, which can only authenticate against it — are not started.

services:
  gotrue:
    profiles: ["disabled"]

  admin_frontend:
    profiles: ["disabled"]

  appflowy_cloud:
    # Build the ARS fork so its membership gate is included in production.
    build:
      context: .
      dockerfile: Dockerfile
    image: ars/appflowy_cloud:local
    environment:
      - ARS_MEMBERSHIP_RPC_URL=${ARS_MEMBERSHIP_RPC_URL:-}
      - ARS_MEMBERSHIP_SERVICE_KEY=${ARS_MEMBERSHIP_SERVICE_KEY:-}
      - ARS_WORKSPACE_OPERATOR_UUID=${ARS_WORKSPACE_OPERATOR_UUID:-}
    # Base depends_on waits for gotrue (disabled above); postgres was only
    # reached transitively through it. APPFLOWY_GOTRUE_BASE_URL points at the
    # nginx internal listener (http://nginx:81/gotrue), hence nginx here.
    #
    # minio is listed because AppFlowy-Cloud creates its S3 bucket during
    # startup (APPFLOWY_S3_CREATE_BUCKET) and aborts the whole process if that
    # call fails — see src/application.rs:466. Upstream never declared the
    # dependency: waiting on gotrue's health check happened to give minio
    # ~30s of head start. Without gotrue, appflowy_cloud reached minio about
    # six seconds after it started and exited immediately.
    depends_on: !override
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nginx:
        condition: service_started

  appflowy_web:
    build:
      args:
        # Pin the embedding patch so Docker's cache cannot reuse an older main.
        REVISION: ${APPFLOWY_WEB_REVISION:-9d872b6c8bd8db71edf96149ed41c383ca986524}

  minio:
    # Docker Hub no longer serves this image. Pin the official multi-arch image.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    # Upstream's 30s interval means nothing depended on this healthcheck
    # before; now that startup blocks on it, check often enough that a deploy
    # is not held up for half a minute.
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 12

  # Both config files travel in images rather than bind mounts: Coolify turns
  # relative bind mounts into managed paths it creates itself, as empty
  # directories, which either fails the container outright (nginx) or silently
  # skips the file (postgres initdb). See the Dockerfiles for the details.
  nginx:
    build:
      context: .
      dockerfile: docker/supabase-nginx/Dockerfile
    image: appflowy-supabase-nginx:local
    volumes: !override
      # Dropping the base nginx.conf mount; keeping the ssl ones, which are
      # long-established Coolify file storages with real content behind them.
      - ./nginx/ssl/certificate.crt:/etc/nginx/ssl/certificate.crt
      - ./nginx/ssl/private_key.key:/etc/nginx/ssl/private_key.key

  postgres:
    build:
      context: .
      dockerfile: docker/supabase-shim/Dockerfile
    image: appflowy-supabase-postgres:local
    volumes: !override
      # A fresh named volume: the initdb shim only runs on an empty data
      # directory, and a bundled-gotrue database is a different identity pool
      # anyway. Old volumes stay on disk, recoverable until deliberately
      # removed (docker volume rm <project>_postgres-data, and _postgres-supabase-data
      # from the deploy that initialised without the shim).
      - postgres_auth_shim_data:/var/lib/postgresql/data

volumes:
  postgres_auth_shim_data:
